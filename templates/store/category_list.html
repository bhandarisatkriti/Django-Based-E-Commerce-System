{% extends 'base.html' %}
{% block content %}

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Category Management</h2>
        <a href="{% url 'category_create' %}" class="btn btn-primary">Add Category</a>
    </div>

    {% if categories %}
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td class="text-end">
                    <a href="{% url 'category_update' category.id %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    <a href="{% url 'category_delete' category.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No categories yet.</p>
    {% endif %}
</div>

{% endblock %}
